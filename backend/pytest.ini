[pytest]
# UTBK Tutor RAG Backend - Pytest Configuration

# Test discovery
testpaths      = tests
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

# Async support (for async def test_* functions)
asyncio_mode = auto

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Custom markers (registered to silence warnings)
markers =
    unit:        unit tests — no I/O, no external services
    integration: integration tests — uses sqlite or fakeredis
    slow:        slow tests, skip in fast CI runs
    llm:         tests that hit real LLM API (expensive, skip by default)

# Filter noisy warnings from deps
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:langchain.*
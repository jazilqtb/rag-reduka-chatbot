server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # SPA fallback: semua route yang tidak match file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets dengan hash (Vite output) — long cache OK karena nama unik
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tidak cache index.html — supaya update deploy langsung kelihatan
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

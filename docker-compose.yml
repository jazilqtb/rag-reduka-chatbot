# ============================================================================
# UTBK Tutor RAG System - Docker Compose
# ----------------------------------------------------------------------------
# Usage:
#   docker compose up -d              # Start everything (postgres, redis, backend, frontend)
#   docker compose up -d postgres redis   # Start only infrastructure
#   docker compose down               # Stop everything
#   docker compose logs -f backend    # Follow backend logs
#
# Environment variables are loaded from .env at the project root.
# Copy .env.example to .env and fill in actual values before running.
# ============================================================================

name: tutor-utbk-rag

services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL - persistent metadata (documents, ingest_jobs)
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tutor-utbk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutor_dev}
      POSTGRES_DB:       ${POSTGRES_DB:-tutor_utbk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql runs only on first start (when the volume is empty).
      # To re-init, run: docker compose down -v
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-tutor} -d ${POSTGRES_DB:-tutor_utbk}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tutor-net


  # ─────────────────────────────────────────────────────────────────────────
  # Redis - cache, session history, rate limit, ingest mutex
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tutor-utbk-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # AOF persistence: data survives container restart (slower writes than RDB,
    # but safer for chat history which has 24h TTL).
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tutor-net


  # ─────────────────────────────────────────────────────────────────────────
  # Backend - FastAPI RAG service
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutor-utbk-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Override host names for inter-container networking.
      # In .env these are 'localhost' for local dev; here we point to the
      # service names so the backend container can reach DB & cache.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      # Persist uploaded PDFs, ChromaDB, and debug output outside the container.
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tutor-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s


  # ─────────────────────────────────────────────────────────────────────────
  # Frontend - React + Vite (served via nginx after build)
  # Note: Build context will be created in Stage 6. Service can be commented
  # out until then.
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tutor-utbk-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - tutor-net
    profiles:
      # Only start with: docker compose --profile ui up
      # This way the compose file is valid before frontend/ exists.
      - ui


volumes:
  postgres_data:
    name: tutor-utbk-postgres-data
  redis_data:
    name: tutor-utbk-redis-data

networks:
  tutor-net:
    name: tutor-utbk-net
    driver: bridge